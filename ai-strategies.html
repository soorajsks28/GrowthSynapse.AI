            height: 40px;

        .svg-defs { display: none; }

        @media (max-width: 768px) {

                padding: 1rem;

                text-align: center;

            }
            .modal-body {
                padding: 1.5rem;
            }
            .modal-title {
                font-size: 1.8rem;
            }
        }

        // Renders Cards with Official App Icons and Gradient Backgrounds
        function renderCards() {
            const grid = document.getElementById('toolsGrid');
            
            toolsData.forEach((tool, index) => {
                const delay = (index % 6) * 0.1;
                // Using Google Favicon API for 100% reliable, official, high-res logos (sz=128)
                const logoUrl = `https://www.google.com/s2/favicons?domain=${tool.domain}&sz=128`;
                
                const cardHTML = `
                    <article class="tool-card animate-up" style="animation-delay: ${delay}s;" onclick="openToolModal('${tool.id}')">
                        <div class="card-media" style="background: ${tool.bg};">
                            <!-- High-Res App Icon injected here -->
                            <img src="${logoUrl}" alt="${tool.title} Icon" class="app-icon" loading="lazy">
                            <svg class="diagram-overlay" viewBox="0 0 24 24" fill="${tool.color}"><use href="#${tool.icon}"></use></svg>
                        </div>
                        <div class="card-content">
                            <span class="category-badge" style="color: ${tool.color}">${tool.category}</span>
                            <h3 class="tool-title">${tool.title}</h3>
                            <p class="tool-desc">${tool.shortDesc}</p>
                            <span class="click-hint" style="color: ${tool.color}">View Details & Strategy &rarr;</span>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Modal Logic
        const modalOverlay = document.getElementById('toolModal');
        const mBanner = document.getElementById('modalBanner');
        const mIcon = document.getElementById('modalAppIcon');
        const mCat = document.getElementById('modalCategory');
        const mTitle = document.getElementById('modalTitle');
        const mText = document.getElementById('modalText');
        const mLink = document.getElementById('modalLink');

        function openToolModal(id) {
            const tool = toolsData.find(t => t.id === id);
            if(tool) {
                const logoUrl = `https://www.google.com/s2/favicons?domain=${tool.domain}&sz=128`;
                
                mBanner.style.background = tool.bg;
                mIcon.src = logoUrl;
                mCat.innerText = tool.category;
                mCat.style.color = tool.color;
                mTitle.innerText = tool.title;
                mText.innerHTML = tool.details;
                mLink.href = tool.link;
                
                mLink.style.background = `linear-gradient(90deg, ${tool.color}, #0f172a)`;
                
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() { 
            modalOverlay.classList.remove('active'); 
            document.body.style.overflow = 'auto'; 
        }
        
        window.onclick = function(e) { if (e.target == modalOverlay) { closeModal(); } }
        window.onload = renderCards;
    </script>
